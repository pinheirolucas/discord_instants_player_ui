<!-- Linux. The circle from the design canvas's platform-mask row; the
     cassette body clears it (its farthest corner sits 48 units from centre).
     Feeds resources/icons/*.png and the runtime window icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <defs><clipPath id="disc"><circle cx="64" cy="64" r="64"/></clipPath></defs>
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="#0d66b4"/>
    <rect x="24" y="38" width="80" height="52" rx="12" fill="#13181d"/>
    <circle cx="50" cy="64" r="12" fill="#d89e09"/>
    <circle cx="50" cy="64" r="4" fill="#13181d"/>
    <circle cx="78" cy="64" r="12" fill="#d89e09"/>
    <circle cx="78" cy="64" r="4" fill="#13181d"/>
  </g>
</svg>

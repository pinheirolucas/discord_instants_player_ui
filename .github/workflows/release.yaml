name: Release

on:
  push:
    tags: ["v*.*.*"]

# Needed for electron-builder's GitHub publisher to create/attach to a
# release with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      # See ci.yaml for why this reads .tool-versions instead of hardcoding
      # the pnpm version.
      - name: Read pnpm version from .tool-versions
        id: pnpm-version
        run: echo "version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm react-test run

  release:
    needs: check
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      # Windows' default shell is PowerShell, which doesn't understand this
      # awk one-liner — spelled out here, unlike ci.yaml, because that job
      # only ever runs on ubuntu-latest.
      - name: Read pnpm version from .tool-versions
        id: pnpm-version
        shell: bash
        run: echo "version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the app, then calls electron-builder --publish=always. All
      # three OSes publish to the same tag concurrently — electron-builder's
      # own documented pattern for multi-OS CI: whichever job's publish call
      # reaches GitHub first creates the (draft, by default) release, the
      # other two find it and attach their assets. Unsigned, so this is
      # never more than a draft to review before hitting Publish.
      - name: Build and publish
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

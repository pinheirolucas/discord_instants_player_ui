name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Read pnpm version from .tool-versions
        id: pnpm-version
        run: echo "version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm react-test run

  release:
    needs: check
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      - name: Read pnpm version from .tool-versions
        id: pnpm-version
        shell: bash
        run: echo "version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build renderer and Electron main process
        run: pnpm react-build && pnpm electron-compile

      - name: Package app
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 20
          retry_wait_seconds: 30
          shell: bash
          command: pnpm exec electron-builder --publish=never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            --jq .body > notes.md

      - name: Create or update release
        uses: nick-fields/retry@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DEBUG: api
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 30
          shell: bash
          command: |
            TAG="${{ github.ref_name }}"
            REPO="${{ github.repository }}"
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release $TAG already exists — a prior run/attempt must have created it. Uploading any missing assets only."
              gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            else
              gh release create "$TAG" dist/* \
                --repo "$REPO" \
                --title "$TAG" \
                --notes-file notes.md
            fi

      - name: Record release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json databaseId,url --jq '"release_id=\(.databaseId) url=\(.url)"' \
            >> "$GITHUB_STEP_SUMMARY"

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Needed for electron-builder's GitHub publisher to create/attach to a
# release, and for the publish job below to edit and un-draft it, all with
# the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      # See ci.yaml for why this reads .tool-versions instead of hardcoding
      # the pnpm version.
      - name: Read pnpm version from .tool-versions
        id: pnpm-version
        run: echo "version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm react-test run

  release:
    needs: check
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up repo
        uses: actions/checkout@v7

      # Windows' default shell is PowerShell, which doesn't understand this
      # awk one-liner — spelled out here, unlike ci.yaml, because that job
      # only ever runs on ubuntu-latest.
      - name: Read pnpm version from .tool-versions
        id: pnpm-version
        shell: bash
        run: echo "version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the app, then calls electron-builder --publish=always. All
      # three OSes publish to the same tag concurrently — electron-builder's
      # own documented pattern for multi-OS CI: whichever job's publish call
      # reaches GitHub first creates the release (draft, by default; see the
      # publish job below), the other two find it and attach their assets.
      - name: Build and publish
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      # electron-builder leaves the release with no body — this is GitHub's
      # own "Generate release notes" (grouped PR titles since the last tag),
      # the same text the web UI's button would produce.
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            --jq .body > notes.md
          {
            echo "body<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # All three platforms' assets are attached by this point (this job
      # needs: release, the whole matrix) — only now does the release go
      # live and become visible to every running copy's update check.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes "${{ steps.notes.outputs.body }}" \
            --draft=false

name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      prerelease:
        description: "Tag as a release candidate (vX.Y.Z-rcN) instead of a final release"
        type: boolean
        default: false
      dry_run:
        description: "Preview the next version only — no commit, tag, push, or build"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: |
          latest=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.bump }}" in
            major) target="v$((major + 1)).0.0" ;;
            minor) target="v$major.$((minor + 1)).0" ;;
            patch) target="v$major.$minor.$((patch + 1))" ;;
          esac

          if ${{ inputs.prerelease }}; then
            last_rc=0
            for t in $(git tag -l "${target}-rc*"); do
              n="${t##*-rc}"
              [ "$n" -gt "$last_rc" ] 2>/dev/null && last_rc="$n"
            done
            next="${target}-rc$((last_rc + 1))"
          else
            next="$target"
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Preview only
        if: ${{ inputs.dry_run }}
        run: |
          echo "Would tag **${{ steps.next.outputs.tag }}** (latest: ${{ steps.next.outputs.latest }}) — dry run, nothing committed." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git identity
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        if: ${{ !inputs.dry_run }}
        run: npm version "${{ steps.next.outputs.tag }}" --allow-same-version

      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags

      - name: Trigger the release build
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yaml --ref "${{ steps.next.outputs.tag }}"
